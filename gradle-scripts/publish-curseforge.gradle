// make sure this script only publishes Clockwork and not the Kelvin submodule
if (project.mod_name != 'clockwork') {
    return
}

// Determine release type
// alpha, beta, or release
def vsReleaseType = 'release'
if (project.hasProperty("CustomReleaseVersion")) {
    def matches = project.property("CustomReleaseVersion") =~ 'release/(?:\\d+\\.){1,2}\\d+(?:-(alpha|beta).\\d+)?'

    vsReleaseType = matches[0][1] ?: 'release'
}

def fileDisplayName = "Clockwork v${project.version} [${project.loader_platform} ${project.minecraft_version}] - ${project.major_update}"

// upgrade curseforge release type if it's an alpha,
// because alpha can't be installed from the curseforge app
def curseForgeReleaseType = vsReleaseType == 'alpha' ? 'beta' : vsReleaseType

// Publish to CurseForge
tasks.register('curseforge') {
    dependsOn remapJar

    doLast {
        if (!project.curse_api_key) {
            throw new GradleException('Set the CurseForge upload token before publishing')
        }

        def metadata = [
            displayName: fileDisplayName,
            releaseType: curseForgeReleaseType,
            changelog: rootProject.file('changelog.md').getText('UTF-8'),
            changelogType: 'markdown',
            gameVersionNames: [project.minecraft_version, project.loader_platform, 'Client', 'Server']
        ]

        def dependencies = ['valkyrien-skies', 'kelvin-vs']
        if (project.loader_platform == 'Forge') {
            dependencies.add('create')
        }
        if (project.loader_platform == 'Fabric') {
            dependencies.addAll(['fabric-api', 'create-fabric'])
        }
        metadata.relations = [projects: dependencies.collect { [slug: it, type: 'requiredDependency'] }]

        def jarFile = remapJar.archiveFile.get().asFile
        project.exec {
            standardInput = new ByteArrayInputStream("X-Api-Token: ${project.curse_api_key}\n".getBytes('UTF-8'))
            commandLine 'curl', '--fail-with-body', '--silent', '--show-error',
                '--header', '@-',
                '--form-string', "metadata=${groovy.json.JsonOutput.toJson(metadata)}",
                '--form', "file=@${jarFile}",
                "https://minecraft.curseforge.com/api/projects/${project.curse_project_id}/upload-file"
        }
    }
}

// Publish to Modrinth
modrinth {
    token = project.modrinth_api_key
    projectId = project.modrinth_project_id
    versionType = vsReleaseType
    versionName = fileDisplayName
    changelog = rootProject.file('changelog.md').text
    versionNumber = "${project.minecraft_version}-${project.loader_platform.toLowerCase()}-${project.version}"
    uploadFile = remapJar
    gameVersions = [project.minecraft_version]
    loaders = [project.loader_platform.toLowerCase()]

    dependencies {
        if (project.loader_platform == 'Forge') {
            required.project 'valkyrien-skies'
            // TODO: Uncomment these once Kelvin is approved on modrinth
            //required.project 'kelvin-vs'
            required.project 'create'
        }

        if (project.loader_platform == 'Fabric') {
            required.project 'valkyrien-skies'
            // TODO: Uncomment these once Kelvin is approved on modrinth
            //required.project 'kelvin-vs'
            required.project 'create-fabric'
        }
    }
}

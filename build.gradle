import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile

plugins {
    // Needed for Forge+Fabric
    id "architectury-plugin" version "3.4.146"
    id "dev.architectury.loom" version "1.3.355" apply false
    // Kotlin
    id "org.jetbrains.kotlin.jvm" version "2.0.0" apply false
    id "io.github.p03w.machete" version "1.2.0" // automatic jar compressing on build

    id "com.modrinth.minotaur" version "2.4.5" apply false
}

// Determine the version.
// Local dev builds use a static "-dev" suffix so commits do not invalidate processResources / jar caches.
def isCiBuild = System.getenv("CI") != null || System.getenv("GITHUB_RUN_NUMBER") != null || System.getenv("CIRCLECI") != null
def isReleaseOrPublishTask = gradle.startParameter.taskNames.any { name ->
    def lower = name.toLowerCase(java.util.Locale.ROOT)
    lower.contains("publish") || lower.contains("curseforge") || lower.contains("modrinth")
}
def useGitVersion = isCiBuild || isReleaseOrPublishTask ||
        (project.findProperty("useGitVersion")?.toString()?.toBoolean() ?: false)

ext.resolvedGitRevision = null
if (!project.hasProperty("CustomReleaseVersion")) {
    if (useGitVersion) {
        String gitRevision = "git rev-parse HEAD".execute().text.trim()
        if (gitRevision.isEmpty()) {
            gitRevision = 'unknown'
        }
        ext.resolvedGitRevision = gitRevision.length() >= 10 ? gitRevision.substring(0, 10) : gitRevision
    } else {
        ext.resolvedGitRevision = 'dev'
    }
}

ext.resolvePlatformVersion = { String platform ->
    if (project.hasProperty("CustomReleaseVersion")) {
        return project.property("CustomReleaseVersion").replaceFirst("^release/", "")
    }
    return "${minecraft_version}-${mod_version}-${platform}-${ext.resolvedGitRevision}"
}

if (project.hasProperty("CustomReleaseVersion")) {
    // Remove release/ from the version if present
    version = project.property("CustomReleaseVersion").replaceFirst("^release/", "")
} else {
    version = mod_version + '+' + ext.resolvedGitRevision
}

ext.activePlatforms = rootProject.enabled_platforms.split(",")
        .collect { it.trim() }
        .findAll { it && findProject(":$it") != null }
if (ext.activePlatforms.isEmpty()) {
    ext.activePlatforms = rootProject.enabled_platforms.split(",").collect { it.trim() }.findAll { it }
}

ext.devFastMode = (project.findProperty("fastDev")?.toString()?.toBoolean() ?: false)
ext.devPerfModsEnabled = !isCiBuild && (project.findProperty("devPerfMods")?.toString() ?: "true").toBoolean()
ext.devDynamicResourcesEnabled = ext.devPerfModsEnabled && (project.findProperty("devDynamicResources")?.toString() ?: "true").toBoolean()
ext.devOptionalModsEnabled = (project.findProperty("devOptionalMods")?.toString() ?: (!ext.devFastMode).toString()).toBoolean()
// Kept opt-in because C2 JIT actually speeds up model baking & mixin transforms on modern CPUs.
ext.devFastClientJvm = (project.findProperty("fastClientJvm")?.toString()?.toBoolean() ?: false)

ext.configureModernFixDevConfig = { File runDir, String platform ->
    if (!ext.devPerfModsEnabled) {
        return
    }
    def configFile = new File(runDir, "config/modernfix-mixins.properties")
    configFile.parentFile.mkdirs()
    def text = configFile.exists() ? configFile.text : "# Auto-created by Clockwork dev build for faster client startup\n"
    def ensureProp = { String key, String value ->
        if (!(text =~ /(?m)^\s*${java.util.regex.Pattern.quote(key)}\s*=/)) {
            if (!text.isEmpty() && !text.endsWith("\n")) {
                text += "\n"
            }
            text += "${key}=${value}\n"
        }
    }
    if (platform == "forge") {
        // Architectury Loom 1.3 leaves two SRG @Shadow methods unremapped in ModernFix's Forge jar
        // (Minecraft.m_231374_ in blast_search_trees and ModelBakery.m_119341_ in dynamic_resources).
        ensureProp("mixin.perf.blast_search_trees", "false")
        ensureProp("mixin.perf.dynamic_resources", "false")
    } else if (ext.devDynamicResourcesEnabled) {
        ensureProp("mixin.perf.dynamic_resources", "true")
    }
    if (!configFile.exists() || configFile.text != text) {
        configFile.text = text
    }
}

def kelvinPublishTasks = [":common:writeVersion", ":common:publishToMavenLocal",
                          ":fabric:publishToMavenLocal", ":forge:publishToMavenLocal"]
def localKelvin = gradle.includedBuilds.find { it.name == "kelvin" }
ext.useLocalKelvin = localKelvin != null
if (localKelvin != null) {
    tasks.register("updateKelvin") {
        dependsOn kelvinPublishTasks.collect { localKelvin.task(it) }
    }
} else {
    tasks.register("updateKelvin", GradleBuild) {
        dir = file("Kelvin").canonicalFile
        buildName = "updateKelvinBuild"
        tasks = kelvinPublishTasks
        startParameter.projectProperties = gradle.startParameter.projectProperties
        onlyIf { new File(dir, "settings.gradle.kts").isFile() || new File(dir, "settings.gradle").isFile() }
    }
}

tasks.named("updateKelvin") {
    doLast {
        def kelvinVersion = file("Kelvin/common/build/version.txt").text.trim()
        def gradleProperties = file("gradle.properties")
        def properties = gradleProperties.text
        def updated = properties.replaceFirst("(?m)^kelvin_version=.*", "kelvin_version=" + kelvinVersion)
        if (updated != properties) {
            gradleProperties.write(updated)
        }
    }
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "org.jetbrains.kotlin.jvm"

    loom {
        silentMojangMappingsLicense()
    }

    repositories {
        maven { url = "https://maven.enjarai.dev/mirrors" }

        // region JEI mavens
        maven {
            // location of the maven that hosts JEI files before January 2023
            name = "Progwml6's maven"
            url = "https://dvs1.progwml6.com/files/maven/"
            content { includeGroup "mezz.jei" }
        }
        maven {
            // location of the maven that hosts JEI files since January 2023
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
            content { includeGroup "mezz.jei" }
        }
        maven {
            // location of a maven mirror for JEI files, as a fallback
            name = "ModMaven"
            url = "https://modmaven.dev"
            content { includeGroup "mezz.jei" }
        }
        // endregion

        mavenCentral()
        maven {
            name "createmod maven"
            url "https://maven.createmod.net/"
        }
        maven {
            url "https://maven.squiddev.cc"
            content {
                includeGroup("cc.tweaked")
            }
        }
        maven { url = "https://maven.shedaniel.me/" } // Cloth Config, REI
        maven { url = "https://maven.parchmentmc.org" } // Parchment mappings
        maven { url = "https://maven.quiltmc.org/repository/release" } // Quilt Mappings
        maven { // Flywheel
            url = "https://maven.tterrag.com/"
        }
        maven {
            url = "https://maven.realrobotix.me/createbigcannons/" // Create Big Cannons
            content {
                includeGroup "com.rbasamoyai"
            }
        }

        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"))

        // layered mappings - Mojmap names, parchment and QM docs and parameters
        mappings(loom.layered {
            it.parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
            it.officialMojangMappings { nameSyntheticMembers = false }
        })
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "kotlin"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.archives_base_name
    version = rootProject.version
    group = rootProject.maven_group

    // Copied from VS oddities. Forces arch to use the right version (which it doesn't for some reason on some machines)
    configurations.configureEach {
        resolutionStrategy.force "org.lwjgl:lwjgl-stb:3.3.1"
        resolutionStrategy.force "org.lwjgl:lwjgl-opengl:3.3.1"
        resolutionStrategy.force "org.lwjgl:lwjgl-openal:3.3.1"
        resolutionStrategy.force "org.lwjgl:lwjgl-tinyfd:3.3.1"
        resolutionStrategy.force "org.lwjgl:lwjgl-jemalloc:3.3.1"
        resolutionStrategy.force "org.lwjgl:lwjgl-glfw:3.3.1"
        resolutionStrategy.force "org.lwjgl:lwjgl:3.3.1"
    }

    repositories {
        mavenLocal()
        maven {
            name = 'Kotlin for Forge'
            url = 'https://thedarkcolour.github.io/KotlinForForge/'
            content { includeGroup "thedarkcolour" }
        }
        maven {
            name = "Valkyrien Skies Internal"
            url = project.vs_maven_url ?: 'https://maven.valkyrienskies.org'
            if (project.vs_maven_username && project.vs_maven_password) {
                credentials {
                    username = project.vs_maven_username
                    password = project.vs_maven_password
                }
            }
        }
        // For VMod + CC tweaked only
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"

        options.release = 17
    }

    tasks.withType(KotlinJvmCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
            freeCompilerArgs += "-Xjvm-default=all"

        }
    }

    java {
        withSourcesJar()
    }

    String buildNumber = System.getenv("GITHUB_RUN_NUMBER")

    machete {
        // disable machete locally for faster builds
        enabled = buildNumber != null
    }
}
